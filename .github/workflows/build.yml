name: Build VST3 Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build

    - name: Build Plugin
      run: cmake --build build --config Release

    - name: Upload VST3
      uses: actions/upload-artifact@v4
      with:
        name: VOXIN2-VST3-Windows
        path: build/Voxin2_artefacts/Release/VST3/
